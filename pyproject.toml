[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudmesh-ai-vm"
version = "1.9.0"
description = "vm command for Cloudmesh AI"
readme = "README.md"
license = "Apache-2.0"
urls = { "Homepage" = "https://github.com/cloudmesh-ai/cloudmesh-ai-vm" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.10"
dependencies = [
    "cloudmesh-ai-common",
    "yamldb",
    "oci",
    "apache-libcloud",
    "openstacksdk",
    "keystoneauth1",
    "python-novaclient",
    "python-neutronclient",
    "python-glanceclient",
    "python-cinderclient",
    "python-manilaclient",
    "python-ironicclient",
    "python-swiftclient",
    "python-chi",
    "paramiko",
    "fabric",
    "chameleon-blazarclient @ git+https://github.com/ChameleonCloud/python-blazarclient.git",
    "chameleon-zunclient @ git+https://github.com/chameleoncloud/python-zunclient.git",
    "ccauth @ git+https://github.com/ChameleonCloud/ccauth.git",
    "pre-commit",
    # Pin known vulnerable transitive dependencies to fixed versions
    "certifi>=2026.10.18",
    "opentelemetry-api>=1.45.1",
]

[project.scripts]
cmx = "cloudmesh.ai.command:cmx"

[project.entry-points."cloudmesh.ai.cmc"]
vm = "cloudmesh.ai.command.vm.vm_group"

[project.entry-points."cloudmesh.ai.vm"]
multipass = "cloudmesh.ai.vm.local.MultipassManager:Provider"
lima = "cloudmesh.ai.vm.local.LimaManager:Provider"
wsl2 = "cloudmesh.ai.vm.local.Wsl2Manager:Provider"
vbox = "cloudmesh.ai.vm.local.VBoxManager:Provider"
jetstream = "cloudmesh.ai.vm.openstack.JetstreamManager:Provider"
chameleon = "cloudmesh.ai.vm.openstack.ChameleonManager:Provider"
aws = "cloudmesh.ai.vm.aws.AwsManager:Provider"
azure = "cloudmesh.ai.vm.azure.AzureManager:Provider"
google = "cloudmesh.ai.vm.google.GoogleManager:Provider"
oracle = "cloudmesh.ai.vm.oracle.OracleManager:Provider"

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "compliance: mark test as a compliance test",
]

[tool.ruff]
# Use the lint section to avoid deprecation warnings
[tool.ruff.lint]
# Ignore N999 (Invalid module name), BLE001 (blind exception) and S110 (try-except-pass) specifically for tests
per-file-ignores = { "tests/**/*" = ["N999", "BLE001", "S110"] }

